services:
  inventory-cassano:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: change-this-secret
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cassano
    depends_on:
      - postgres
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cassano
    volumes:
      - cassano_pg:/var/lib/postgresql/data
volumes:
  cassano_pg:
