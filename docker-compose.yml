services:
  inventory-cassano:
    build: .
    container_name: inventory-cassano
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: change-this-to-a-long-random-secret
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - cassano_data:/app/data
