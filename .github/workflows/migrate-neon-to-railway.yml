name: Migrate Neon to Railway PostgreSQL

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}

    steps:
      - name: Check connection variables
        run: |
          test -n "${NEON_DATABASE_URL}" || (echo "Missing NEON_DATABASE_URL secret" && exit 1)
          test -n "${RAILWAY_DATABASE_URL}" || (echo "Missing RAILWAY_DATABASE_URL secret" && exit 1)

      - name: Check PostgreSQL client
        run: |
          docker run --rm postgres:16 pg_dump --version
          docker run --rm postgres:16 pg_restore --version
          docker run --rm postgres:16 psql --version

      - name: Check source database
        run: |
          docker run --rm -e DATABASE_URL="${NEON_DATABASE_URL}" postgres:16             psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c "SELECT current_database(), version();"

      - name: Dump Neon database
        run: |
          docker run --rm             -e DATABASE_URL="${NEON_DATABASE_URL}"             -v "${RUNNER_TEMP}:/backup"             postgres:16             pg_dump "${DATABASE_URL}"               --format=custom               --no-owner               --no-acl               --file=/backup/inventory-cassano.dump
          ls -lh "${RUNNER_TEMP}/inventory-cassano.dump"

      - name: Restore into Railway PostgreSQL
        run: |
          docker run --rm             -e DATABASE_URL="${RAILWAY_DATABASE_URL}"             -v "${RUNNER_TEMP}:/backup"             postgres:16             pg_restore               --dbname="${DATABASE_URL}"               --no-owner               --no-acl               --exit-on-error               /backup/inventory-cassano.dump

      - name: Verify Railway database
        run: |
          docker run --rm -e DATABASE_URL="${RAILWAY_DATABASE_URL}" postgres:16             psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c "\\dt"
          docker run --rm -e DATABASE_URL="${RAILWAY_DATABASE_URL}" postgres:16             psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 -c "SELECT count(*) AS table_count FROM information_schema.tables WHERE table_schema='public';"

      - name: Remove dump
        if: always()
        run: rm -f "${RUNNER_TEMP}/inventory-cassano.dump"
