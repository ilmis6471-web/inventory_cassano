services:
  - type: web
    name: inventory-cassano
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cassano-db
          property: connectionString

databases:
  - name: cassano-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
